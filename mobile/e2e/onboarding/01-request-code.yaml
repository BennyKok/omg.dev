# Onboarding, first half: a fresh install through the welcome flow up to the
# point where the app has asked auth for a sign-in code.
#
# Runs only through `bun run test:e2e --flow onboarding`, which supplies EMAIL,
# reads the code from Gmail after this half, and runs 02-verify.yaml with it.
# It is in its own folder so a plain `maestro test e2e/` does not pick it up.
#
# Needs the simulator-release build (bundle embedded, no dev client):
# `launchApp` with clearState is what makes every run start at step 01.
appId: dev.omg.computer
---
- launchApp:
    clearState: true
# The shared simulator sometimes shows an iCloud "Apple Account Verification"
# alert over the app. It is the system's, not ours; dismiss it if present.
- extendedWaitUntil:
    visible: "Get started|Apple Account Verification"
    timeout: 60000
- runFlow:
    when:
      visible: "Apple Account Verification"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible: "Get started"
    timeout: 60000
# Sign-in comes straight after Welcome; the questions run after sign-in and
# are walked by 02-verify.yaml.
- tapOn: "Get started"
- extendedWaitUntil:
    visible: "Continue with email"
    timeout: 15000
- tapOn: "Continue with email"
- extendedWaitUntil:
    visible: "you@example.com"
    timeout: 15000
- tapOn: "you@example.com"
- inputText: ${EMAIL}
- tapOn: "Send sign-in code"
# Auth scores this request like a browser (the app sends an Origin header) and
# challenges the FOURTH send from one IP inside an hour. The app has no
# Turnstile, so that is a dead end. Fail here by name instead of 30s later on
# a screen that never comes. See e2e/README.md, "Rate of runs".
- assertNotVisible: "Please confirm you are a person, then try again."
# The code screen. Its field is focused on arrival, so 02-verify types into it
# without a tap.
- extendedWaitUntil:
    visible: "Use a different email"
    timeout: 30000
