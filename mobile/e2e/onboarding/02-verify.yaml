# Onboarding, second half: enter the code the runner read from Gmail, then walk
# the signed-in steps and assert each screen's chrome. Ends on the home list.
appId: dev.omg.computer
---
- inputText: ${CODE}
# Data notice (first sign-in only).
# 02, the first-task cards (2026-09-25). A card starts its task at once:
# no prompt screen.
- extendedWaitUntil:
    visible: "Build my app"
    timeout: 20000
- assertVisible: "Build an app.*"
- assertNotVisible: "First prompt."
- tapOn: "Build my app"
# The data notice comes before anything is sent to an AI provider.
- extendedWaitUntil:
    visible: "Agree and continue"
    timeout: 15000
- assertVisible: "Your data and AI providers"
# "Not now" returns a new sign-up to the cards, not to sign-in.
- tapOn: "Not now"
- extendedWaitUntil:
    visible: "Build my app"
    timeout: 10000
- assertNotVisible: "Welcome to omg.dev"
- tapOn: "Build my app"
- extendedWaitUntil:
    visible: "Agree and continue"
    timeout: 15000
- tapOn: "Agree and continue"
- extendedWaitUntil:
    visible: "Notify me"
    timeout: 120000
- assertVisible: "Get notified when your result is ready."
- assertVisible: "1 working"
- assertVisible: "Your result is ready"
- tapOn: "Not now"
# 05 · Continue. The card is the live session with its header.
# "Not now" can be answered while the Computer is still starting; the flow
# moves on once the task has started, so this also waits for the Computer.
- extendedWaitUntil:
    visible: "Let me in"
    timeout: 120000
- assertVisible: "Keep track of your agent."
# The transcript card is one accessibility element; its header text is not
# addressable on its own.
- assertVisible: "Open this session"
- tapOn: "Let me in"
# 06 · Plan.
- extendedWaitUntil:
    visible: "Continue for now"
    timeout: 30000
- assertVisible: "Keep work moving."
- assertVisible: "Agents at once"
- assertVisible: "More included"
- assertNotVisible: "Annually"
# Personal is preselected, so the CTA reads its name.
- assertVisible: "Continue with Personal"
- tapOn: "Continue for now"
# No connect or plan setup pages since 2026-09-24: straight into the session.
# Lands in the first session itself, header first: the task they wrote is
# the title, and the model it ran on is under it.
- extendedWaitUntil:
    visible: "Build a mobile app prototype.*"
    timeout: 60000
- assertNotVisible: "Bring your agent."
- takeScreenshot: onboarding-session
