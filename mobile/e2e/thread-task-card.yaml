# A task in a thread's replies is the session list's compact row (agent mark,
# title, "Done · web"), an attachment rather than a big card.
#   EXPO_PUBLIC_OMG_DEMO=1 EXPO_PUBLIC_OMG_THREADS_FIXTURE=1 bun run test:e2e --build --flow thread-task-card --record
appId: dev.omg.computer
onFlowStart:
  - launchApp
---
- openLink: "omg://thread/0d3a7c1e-0000-4000-8000-00000000abcd"
- tapOn: ".*2 replies, task Done.*"
- assertVisible: ".*Fix the signup email typo.*"
- assertVisible: ".*Done · web.*"
- takeScreenshot: thread-task-card
