# Pull the iPad rail down past the refresh to start a thread. Same gesture as
# thread-pull.yaml, on the rail at the left edge instead of the phone list.
#
# The Jev plan runner only taps, so the gesture lives in this static flow.
# Run on a build with demo data:
#   EXPO_PUBLIC_OMG_DEMO=1 EXPO_PUBLIC_OMG_THREADS_FIXTURE=1 bun run test:e2e --build --device "iPad Pro 11-inch (M5)" --flow thread-pull-ipad --record
appId: dev.omg.computer
onFlowStart:
  # A release build (--build) has no dev client, so launching is safe and
  # makes the flow independent of whatever the shared device last showed.
  - launchApp
  # Back to Home from a thread or a new thread a previous run left open.
  - runFlow:
      when:
        visible:
          id: "thread-new-back"
      commands:
        - tapOn:
            id: "thread-new-back"
  - runFlow:
      when:
        visible:
          id: "chat-header-back"
      commands:
        - tapOn:
            id: "chat-header-back"
---
- assertVisible:
    id: "home-composer-input"
# No threads yet: no Threads heading, and no New button to look for.
- assertNotVisible: "Threads"
# A short pull only refreshes: Home stays.
- swipe:
    start: "12%, 35%"
    end: "12%, 45%"
    duration: 600
- assertVisible:
    id: "home-composer-input"
- assertNotVisible: "What is on your mind?"
# A long pull, then release, opens an empty thread.
- swipe:
    start: "12%, 30%"
    end: "12%, 90%"
    duration: 1500
- assertVisible: "What is on your mind?"
- assertVisible: "New thread"
