<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Starting omg.dev</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">omg</div>
      <p class="eyebrow">LOCAL AGENT RUNTIME</p>
      <h1>Connecting to omg.dev</h1>
      <p class="summary">
        The desktop app is waiting for the background service on this Mac.
        It will connect automatically when the service is ready.
      </p>
      <div class="status" role="status">
        <span class="pulse" aria-hidden="true"></span>
        Checking <code>127.0.0.1:8766</code>
      </div>
      <div class="help">
        <span>First time on this computer?</span>
        <code>bun install --global @omg-dev/cli &amp;&amp; omg computer setup</code>
      </div>
    </main>
  </body>
</html>
