<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Starting omg.dev</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">omg</div>
      <p class="eyebrow">LOCAL AGENT RUNTIME</p>
      <h1>Starting omg.dev</h1>
      <p class="summary">
        The desktop app is preparing your local agent runtime. If omg.dev is
        already running on this computer, the app will use it automatically.
      </p>
      <div class="status" role="status">
        <span class="pulse" aria-hidden="true"></span>
        Starting the local app
      </div>
    </main>
  </body>
</html>
