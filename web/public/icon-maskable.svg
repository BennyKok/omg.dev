<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>omg.dev</title>
  <!-- Canonical app tile. scripts/generate-icons.ts derives every platform
       variant from this file. Geometry matches the existing orange brand mark. -->
  <rect id="background" width="100" height="100" fill="#FFFFFF"/>
  <g transform="translate(9.999999999999998 9.999999999999998) scale(0.8)"><g id="mark" transform="translate(9 9) scale(.82)">
    <mask id="disc">
      <rect width="100" height="100" fill="white"/>
      <circle cx="71" cy="29" r="14" fill="black"/>
    </mask>
    <circle cx="50" cy="50" r="44" fill="#FF5530" mask="url(#disc)"/>
  </g></g>
</svg>
