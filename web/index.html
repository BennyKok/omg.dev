<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f2f2f7" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=20260822-omg-mark" />
    <!-- Bump the URL when the pixels change: iOS keeps touch icons outside the
         normal HTTP/service-worker cache and can otherwise reuse them. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260822-omg-mark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="omg" />
    <title>omg</title>
    <script>
      /* Apply the theme class BEFORE first paint, so --background resolves to
         the dark value on the very first frame. Without this, the app's bundled
         CSS (`html { background: var(--background) }`) overrides the inline dark
         rule below but resolves --background to its light default until main.tsx
         adds `.dark` post-bundle — leaving the uncovered bottom safe-area strip
         light for a beat (the "white border" under the splash). Read the saved
         preference here as well so reloads never flash the OS theme first. */
      try {
        var savedTheme = null;
        try {
          savedTheme = localStorage.getItem("lfg_theme");
        } catch (e) {}
        var startsDark =
          savedTheme === "dark" ||
          (savedTheme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(startsDark ? "dark" : "light");
        document.documentElement.style.colorScheme = startsDark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content =
          startsDark ? "#141414" : "#f2f2f7";
      } catch (e) {}
    </script>
    <style>
      /* Paint the shell background on html/body too, not just the splash. A
         fixed element only covers the layout viewport, so on mobile the bottom
         safe-area / overscroll region would otherwise show the browser's default
         white — the "white border at the bottom". Match the theme-color metas so
         every pixel is the same colour before, during, and after the splash. */
      html,
      body {
        margin: 0;
        background: #f2f2f7;
      }
      html.dark,
      html.dark body {
        background: #141414;
      }

      /* App shell splash — static markup inside #root so it paints on the very
         first frame (no JS needed) and React replaces it the moment the app
         mounts. Colours mirror the theme-color metas.
         The mascot: "Boxy", a hand-drawn ink computer whose face is amber
         pixels (line = hardware, pixels = software). It powers on: asleep,
         a CRT line snaps open, the eyes boot in, it looks around, smiles,
         then idles with a blink. Pure CSS + SVG so it runs before any JS; the
         sequence front-loads the power-on because most loads end within ~1s. */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f2f2f7;
        --ink: #1d1a17;
        --ink-muted: rgba(40, 30, 20, 0.55);
      }
      html.dark #app-splash {
        background: #141414;
        --ink: #f2f2ed;
        --ink-muted: rgba(235, 230, 220, 0.55);
      }
      #app-splash .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        margin-bottom: env(safe-area-inset-bottom, 0px);
      }
      #app-splash .splash-caption {
        font: 500 14px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        color: var(--ink-muted);
        opacity: 0;
        animation: splash-fade 0.4s 0.3s ease-out forwards;
      }
      #app-splash .boxy { overflow: visible; }
      #app-splash .ink {
        fill: none;
        stroke: var(--ink);
        stroke-width: 3.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: url(#splash-boil);
      }
      #app-splash .face rect { fill: #ffb547; }
      #app-splash .grid, #app-splash .face, #app-splash .cover, #app-splash .crt,
      #app-splash .face g { transform-box: fill-box; }
      /* Asleep: dim screen, one pixel z drifts off. */
      #app-splash .grid { opacity: 0.35; animation: splash-on 0.01s 0.45s forwards; }
      #app-splash .zz path { fill: none; stroke: #ffb547; stroke-width: 3; stroke-linejoin: miter; }
      #app-splash .zz { opacity: 0; animation: splash-z 0.6s ease-out forwards; }
      /* CRT power-on: a bright line snaps open to fill the screen, then fades. */
      #app-splash .crt {
        fill: #ffb547;
        opacity: 0;
        transform-origin: 50% 50%;
        animation: splash-crt 0.32s 0.42s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      /* Eyes boot in from the top: the cover slides away row by row. */
      #app-splash .cover {
        transform-origin: 50% 100%;
        animation: splash-boot 0.36s 0.74s steps(7, end) forwards;
      }
      #app-splash .face { animation: splash-look 0.9s 1.15s ease-in-out both; }
      #app-splash .f-happy, #app-splash .f-blink { opacity: 0; }
      #app-splash .f-idle { animation: splash-idle-intro 0.7s 2.05s both, splash-idle-blink 3.2s 2.75s infinite; }
      #app-splash .f-happy { animation: splash-happy 0.7s 2.05s both; }
      #app-splash .f-blink { animation: splash-blink 3.2s 2.75s infinite; }
      @keyframes splash-fade { to { opacity: 1; } }
      @keyframes splash-on { to { opacity: 1; } }
      @keyframes splash-z {
        0% { opacity: 0; transform: translate(0, 4px); }
        35% { opacity: 1; }
        100% { opacity: 0; transform: translate(8px, -16px); }
      }
      @keyframes splash-crt {
        0% { opacity: 1; transform: scale(0.9, 0.04); }
        55% { opacity: 0.9; transform: scale(1, 1); }
        100% { opacity: 0; transform: scale(1, 1); }
      }
      @keyframes splash-boot { from { transform: scaleY(1); } to { transform: scaleY(0); } }
      @keyframes splash-look {
        0%, 100% { transform: translate(0, 0); }
        25%, 42% { transform: translate(-6.4px, 0); }
        62%, 80% { transform: translate(6.4px, 0); }
      }
      @keyframes splash-idle-intro { 0%, 100% { opacity: 1; } 1%, 99% { opacity: 0; } }
      @keyframes splash-happy { 0%, 100% { opacity: 0; } 1%, 99% { opacity: 1; } }
      @keyframes splash-idle-blink { 0%, 92%, 100% { opacity: 1; } 94%, 98% { opacity: 0; } }
      @keyframes splash-blink { 0%, 92%, 100% { opacity: 0; } 94%, 98% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #app-splash *, #app-splash .face g { animation: none !important; }
        #app-splash .ink { filter: none; }
        #app-splash .grid, #app-splash .splash-caption { opacity: 1; }
        #app-splash .cover, #app-splash .crt, #app-splash .zz { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash" aria-hidden="true">
        <div class="splash-inner">
          <svg class="boxy" viewBox="0 0 200 200" width="132" height="132">
            <defs><pattern id="splash-grid" x="59.4" y="51" width="6.4" height="6.4" patternUnits="userSpaceOnUse"><rect x=".6" y=".6" width="5.2" height="5.2" rx="1" fill="#ffb547" fill-opacity=".13"/></pattern>
            <filter id="splash-boil" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="1"><animate attributeName="seed" values="1;2;3;4" dur=".5s" repeatCount="indefinite" calcMode="discrete"/></feTurbulence><feDisplacementMap in="SourceGraphic" scale="2.6"/></filter></defs>
            <rect x="58" y="42" width="86" height="63" rx="6" fill="#1d1209"/>
            <rect class="grid" x="58" y="42" width="86" height="63" rx="6" fill="url(#splash-grid)"/>
            <g class="face"><g class="f-idle"><rect x="72.8" y="58.0" width="5.2" height="5.2" rx="1"/><rect x="79.2" y="58.0" width="5.2" height="5.2" rx="1"/><rect x="117.6" y="58.0" width="5.2" height="5.2" rx="1"/><rect x="124.0" y="58.0" width="5.2" height="5.2" rx="1"/><rect x="72.8" y="64.4" width="5.2" height="5.2" rx="1"/><rect x="79.2" y="64.4" width="5.2" height="5.2" rx="1"/><rect x="117.6" y="64.4" width="5.2" height="5.2" rx="1"/><rect x="124.0" y="64.4" width="5.2" height="5.2" rx="1"/><rect x="72.8" y="70.8" width="5.2" height="5.2" rx="1"/><rect x="79.2" y="70.8" width="5.2" height="5.2" rx="1"/><rect x="117.6" y="70.8" width="5.2" height="5.2" rx="1"/><rect x="124.0" y="70.8" width="5.2" height="5.2" rx="1"/><rect x="92.0" y="83.6" width="5.2" height="5.2" rx="1"/><rect x="98.4" y="83.6" width="5.2" height="5.2" rx="1"/><rect x="104.8" y="83.6" width="5.2" height="5.2" rx="1"/></g><g class="f-happy"><rect x="72.8" y="58.0" width="5.2" height="5.2" rx="1"/><rect x="85.6" y="58.0" width="5.2" height="5.2" rx="1"/><rect x="111.2" y="58.0" width="5.2" height="5.2" rx="1"/><rect x="124.0" y="58.0" width="5.2" height="5.2" rx="1"/><rect x="66.4" y="64.4" width="5.2" height="5.2" rx="1"/><rect x="92.0" y="64.4" width="5.2" height="5.2" rx="1"/><rect x="104.8" y="64.4" width="5.2" height="5.2" rx="1"/><rect x="130.4" y="64.4" width="5.2" height="5.2" rx="1"/><rect x="85.6" y="77.2" width="5.2" height="5.2" rx="1"/><rect x="111.2" y="77.2" width="5.2" height="5.2" rx="1"/><rect x="92.0" y="83.6" width="5.2" height="5.2" rx="1"/><rect x="98.4" y="83.6" width="5.2" height="5.2" rx="1"/><rect x="104.8" y="83.6" width="5.2" height="5.2" rx="1"/></g><g class="f-blink"><rect x="72.8" y="70.8" width="5.2" height="5.2" rx="1"/><rect x="79.2" y="70.8" width="5.2" height="5.2" rx="1"/><rect x="117.6" y="70.8" width="5.2" height="5.2" rx="1"/><rect x="124.0" y="70.8" width="5.2" height="5.2" rx="1"/><rect x="92.0" y="83.6" width="5.2" height="5.2" rx="1"/><rect x="98.4" y="83.6" width="5.2" height="5.2" rx="1"/><rect x="104.8" y="83.6" width="5.2" height="5.2" rx="1"/></g></g>
            <rect class="cover" x="58" y="42" width="86" height="63" rx="6" fill="#1d1209"/>
            <rect class="crt" x="58" y="42" width="86" height="63" rx="6"/>
            <g class="ink"><path d="M52 22C92 19 130 20 150 23C160 25 163 32 163 44L164 150C164 160 158 165 147 165L54 166C43 166 38 160 38 149L37 40C37 29 42 23 52 22Z"/><path d="M58 42C85 40 120 40 143 42L144 104C120 106 84 106 57 105Z"/><path d="M110 130L146 129M118 140L146 140M58 136C60 133 66 133 68 136M60 166L56 178M142 166L146 178M48 178L66 178M136 178L154 178"/></g>
            <g class="zz"><path d="M170 26h10l-10 10h10"/></g>
          </svg>
          <div class="splash-caption">Waking up your computer…</div>
        </div>
      </div>
    </div>
    <script>
      /* PWA recovery that does NOT depend on the app bundle.
         If a stale installed shell names deleted /assets/* chunks, main.tsx
         never runs and the home-screen app stays black forever. Register the
         worker from this inline script (push-only, no fetch interception), and
         on an entry-module failure wipe shell/asset caches once + reload.
         Page reloads for updates are owned by main.tsx (toast Reload or cold
         open) — this shell does not hard-reload on controllerchange.
         If the splash is still up after several seconds, show a recovery UI
         instead of an endless black screen (common when the network path to
         the box is down or the entry module never evaluates). */
      (function () {
        var bootRecovering = false;
        // Once the app module evaluates, we are past "network never delivered
        // the shell" — cancel the stuck recovery even if React has not painted
        // data-startup-state yet. A 4s timeout was firing mid-download on
        // phone + Tailscale cold loads (especially after a hard reload), so
        // users saw "lfg did not finish loading" and then the real UI 1–2s later.
        var appModuleLoaded = false;
        var stuckTimer = null;

        /* Boot beacons — the device half of /__lfg_pwa_diag.
           A black home-screen window cannot be inspected: no console, no error
           page, no way to attach a debugger to someone's phone. Reporting each
           phase to the server is what turns "it's black" into a named layer.
           Fire-and-forget by design: never block boot, never throw, and never
           let a failed beacon become a second failure to debug. */
        var bootId = String(Date.now()) + "-" + Math.random().toString(36).slice(2, 8);
        function displayMode() {
          try {
            if (navigator.standalone === true) return "standalone";
            var modes = ["standalone", "minimal-ui", "fullscreen", "browser"];
            for (var i = 0; i < modes.length; i++) {
              if (matchMedia("(display-mode: " + modes[i] + ")").matches) return modes[i];
            }
          } catch (e) {}
          return "unknown";
        }
        function beacon(phase, detail) {
          try {
            var body = JSON.stringify({
              phase: phase,
              bootId: bootId,
              mode: displayMode(),
              detail: detail || {},
            });
            if (navigator.sendBeacon) {
              navigator.sendBeacon("/__lfg_boot", body);
              return;
            }
            fetch("/__lfg_boot", { method: "POST", body: body, keepalive: true }).catch(
              function () {},
            );
          } catch (e) {}
        }
        window.__lfgBeacon = beacon;

        beacon("html-parsed", {
          ref: document.referrer || "",
          sw: "serviceWorker" in navigator,
          controlled: !!(navigator.serviceWorker && navigator.serviceWorker.controller),
        });
        document.addEventListener("DOMContentLoaded", function () {
          beacon("dom-ready", {});
        });
        window.addEventListener("error", function (event) {
          /* Resource errors are reported separately as asset-error below. */
          if (event && event.target && event.target.tagName === "SCRIPT") return;
          beacon("page-error", { msg: String((event && event.message) || "").slice(0, 200) });
        });

        function storageGet(key) {
          try {
            return sessionStorage.getItem(key);
          } catch (e) {
            return null;
          }
        }
        function storageSet(key, value) {
          try {
            sessionStorage.setItem(key, value);
            return true;
          } catch (e) {
            return false;
          }
        }

        function purgeShellCaches() {
          if (!("caches" in window)) return Promise.resolve();
          return caches.keys().then(function (keys) {
            return Promise.all(
              keys
                .filter(function (key) {
                  return (
                    key.indexOf("lfg-shell-") === 0 ||
                    key.indexOf("lfg-assets-") === 0
                  );
                })
                .map(function (key) {
                  return caches.delete(key);
                }),
            );
          });
        }

        function hardResetPwa() {
          if (bootRecovering) return;
          bootRecovering = true;
          var chain = purgeShellCaches();
          if ("serviceWorker" in navigator) {
            chain = chain
              .then(function () {
                return navigator.serviceWorker.getRegistrations();
              })
              .then(function (regs) {
                return Promise.all(
                  regs.map(function (reg) {
                    return reg.unregister();
                  }),
                );
              });
          }
          chain
            .catch(function () {})
            .then(function () {
              location.replace("/?pwa_reset=" + Date.now());
            });
        }

        function clearStuckTimer() {
          if (stuckTimer != null) {
            clearTimeout(stuckTimer);
            stuckTimer = null;
          }
        }

        // Called from main.tsx as soon as the entry module evaluates — before
        // createRoot — so a slow first paint never races into the recovery UI.
        window.__lfgMarkAppModule = function () {
          appModuleLoaded = true;
          clearStuckTimer();
        };

        function showStuckSplashRecovery(reason) {
          // Module already running: leave the splash (or React) alone.
          if (appModuleLoaded) return;
          var splash = document.getElementById("app-splash");
          if (!splash || !splash.parentNode) return;
          // App already replaced the splash.
          if (!document.getElementById("app-splash")) return;
          var root = document.getElementById("root");
          if (!root) return;
          // If React mounted, root no longer contains #app-splash as sole child
          // of a cold document — but createRoot replaces contents, so splash gone.
          if (!document.getElementById("app-splash")) return;
          if (document.querySelector("[data-startup-state]")) return;

          root.innerHTML =
            '<main style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;gap:0.85rem;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#141414;color:#f4f4f5">' +
            "<h1 style=\"margin:0;font-size:1.15rem;font-weight:600\">omg did not finish loading</h1>" +
            '<p style="margin:0;max-width:22rem;line-height:1.45;color:#a1a1aa;font-size:.95rem">' +
            (reason ||
              "The app shell is up but the UI never mounted. This is usually a network path to the box (Tailscale) or a broken install.") +
            "</p>" +
            '<p style="margin:0;max-width:22rem;line-height:1.45;color:#71717a;font-size:.8rem">Open this same URL in Safari. If Safari works, delete the home-screen icon and re-add it from Safari.</p>' +
            '<div style="display:flex;flex-wrap:wrap;gap:0.5rem;justify-content:center;margin-top:0.35rem">' +
            '<button type="button" id="lfg-boot-retry" style="appearance:none;border:0;border-radius:999px;padding:.7rem 1.15rem;font:inherit;font-weight:600;background:#0a84ff;color:#fff">Retry</button>' +
            '<button type="button" id="lfg-boot-reset" style="appearance:none;border:0;border-radius:999px;padding:.7rem 1.15rem;font:inherit;font-weight:600;background:#27272a;color:#f4f4f5">Reset install data</button>' +
            "</div></main>";
          var retry = document.getElementById("lfg-boot-retry");
          var reset = document.getElementById("lfg-boot-reset");
          if (retry) retry.onclick = function () {
            location.reload();
          };
          if (reset) reset.onclick = hardResetPwa;
        }

        // Stuck on the black splash with no app module. Only escalate when the
        // entry bundle never arrives — not on a slow-but-successful cold load.
        // 12s is long enough for phone + Tailscale to pull the shell after a
        // hard reload; true dead installs still get a recovery UI instead of
        // an endless black screen.
        var STUCK_MS = 12000;
        stuckTimer = setTimeout(function () {
          stuckTimer = null;
          if (appModuleLoaded) return;
          if (!document.getElementById("app-splash")) return;
          if (document.querySelector("[data-startup-state]")) return;
          beacon("stuck", { afterMs: STUCK_MS });
          showStuckSplashRecovery();
        }, STUCK_MS);

        // If React mounts without going through __lfgMarkAppModule (tests /
        // future entry paths), still cancel once the shell is live.
        try {
          var rootEl = document.getElementById("root");
          if (rootEl && typeof MutationObserver === "function") {
            var bootObserver = new MutationObserver(function () {
              if (
                appModuleLoaded ||
                !document.getElementById("app-splash") ||
                document.querySelector("[data-startup-state]")
              ) {
                appModuleLoaded = true;
                clearStuckTimer();
                bootObserver.disconnect();
              }
            });
            bootObserver.observe(rootEl, { childList: true, subtree: true });
          }
        } catch (e) {}

        if (!("serviceWorker" in navigator)) {
          beacon("sw-failed", { reason: "unsupported" });
          return;
        }

        // updateViaCache:"none" is load-bearing on iOS. The default lets the
        // HTTP cache satisfy sw.js update checks, so an installed PWA can keep
        // the same dead worker across many deploys and never see recovery code.
        var regPromise = navigator.serviceWorker
          .register("/sw.js", { updateViaCache: "none" })
          .catch(function (error) {
            beacon("sw-failed", { reason: String((error && error.message) || error).slice(0, 200) });
            return null;
          });

        regPromise.then(function (reg) {
          if (!reg) return;
          beacon("sw-registered", { scope: reg.scope || "" });
          // Do not SKIP_WAITING or reload here. Cold-open adopt + hard-reload
          // are owned by main.tsx (activateUpdate when reg.waiting). Mid-session
          // updates only show a toast — a controllerchange reload used to yank
          // the UI out from under active product use on every deploy.
          reg.update().catch(function () {});
        });

        window.addEventListener(
          "error",
          function (event) {
            var target = event && event.target;
            if (!target || target.tagName !== "SCRIPT") return;
            var src = target.src || "";
            if (src.indexOf("/assets/") === -1) return;
            beacon("asset-error", { src: src.slice(-80) });
            var latch = "lfg:boot-recover:" + (src.split("/").pop() || "entry");
            if (storageGet(latch) === "1") {
              showStuckSplashRecovery(
                "The app bundle failed to load even after one recovery try.",
              );
              return;
            }
            if (!storageSet(latch, "1")) {
              showStuckSplashRecovery("The app bundle failed to load.");
              return;
            }
            purgeShellCaches()
              .catch(function () {})
              .then(function () {
                location.reload();
              });
          },
          true,
        );
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
