<!-- @dsCard group="Patterns" name="Metric card" subtitle="Stat + sparkline + usage bar" width="720" height="420" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Metric card</title>
<!-- @tokens -->
<style>
  .metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .spark { display: block; margin-top: 8px; width: 100%; height: 28px; }
</style>
</head>
<body>
<div class="pane pane--light">
  <div class="metrics">
    <div class="metric-card">
      <div class="metric-label">Memory</div>
      <div class="metric-value">7.2 GB <span class="metric-unit">/ 32</span></div>
      <svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none">
        <polyline points="0,20 12,18 24,21 36,14 48,16 60,10 72,12 84,8 100,9" fill="none" stroke="var(--primary)" stroke-width="1.5"/>
      </svg>
      <div class="usage-bar"><i style="width:23%"></i></div>
    </div>
    <div class="metric-card">
      <div class="metric-label">CPU</div>
      <div class="metric-value">64<span class="metric-unit">%</span></div>
      <svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none">
        <polyline points="0,22 12,16 24,18 36,8 48,12 60,6 72,14 84,5 100,10" fill="none" stroke="var(--warning)" stroke-width="1.5"/>
      </svg>
      <div class="usage-bar"><i class="warn" style="width:64%"></i></div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Disk</div>
      <div class="metric-value">92<span class="metric-unit">%</span></div>
      <svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none">
        <polyline points="0,14 12,13 24,12 36,12 48,10 60,8 72,6 84,4 100,3" fill="none" stroke="var(--destructive)" stroke-width="1.5"/>
      </svg>
      <div class="usage-bar"><i class="crit" style="width:92%"></i></div>
    </div>
  </div>
  <p class="footnote" style="padding:0;margin-top:14px">
    Tone thresholds: primary under warn, warning at warn, destructive at crit —
    the same three tones as status dots, never a fourth color.
    Card = the standard 16px group card with 14/16 padding.
  </p>
</div>
</body>
</html>
