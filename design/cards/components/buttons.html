<!-- @dsCard group="Components" name="Buttons" subtitle="Primary / tint / soft / outline / secondary / ghost / destructive, 4 sizes" width="760" height="560" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buttons</title>
<!-- @tokens -->
</head>
<body>
<div class="panes">
  <div class="pane pane--light">
    <p class="demo-title">Variants</p>
    <div class="demo-grid">
      <button class="btn btn--primary">Start session</button>
      <button class="btn btn--brand-soft">Add sign-in</button>
      <button class="btn btn--tint">Configure</button>
      <button class="btn btn--outline">Outline</button>
    </div>
    <div class="demo-grid" style="margin-top:10px">
      <button class="btn btn--secondary">Secondary</button>
      <button class="btn btn--ghost">Ghost</button>
      <button class="btn btn--destructive">Close session</button>
      <button class="btn btn--link">Link</button>
    </div>
    <p class="demo-title">Sizes</p>
    <div class="demo-grid">
      <button class="btn btn--primary btn--xs">Extra small</button>
      <button class="btn btn--primary btn--sm">Small</button>
      <button class="btn btn--primary">Default</button>
      <button class="btn btn--primary btn--lg">Large</button>
      <button class="btn btn--tint btn--icon" aria-label="Settings">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <p class="demo-title">Disabled</p>
    <div class="demo-grid">
      <button class="btn btn--primary" disabled>Start session</button>
      <button class="btn btn--secondary" disabled>Secondary</button>
    </div>
  </div>
  <div class="pane pane--dark">
    <p class="demo-title">Dark</p>
    <div class="demo-grid">
      <button class="btn btn--primary">Start session</button>
      <button class="btn btn--brand-soft">Add sign-in</button>
      <button class="btn btn--tint">Configure</button>
      <button class="btn btn--outline">Outline</button>
    </div>
    <div class="demo-grid" style="margin-top:10px">
      <button class="btn btn--secondary">Secondary</button>
      <button class="btn btn--ghost">Ghost</button>
      <button class="btn btn--destructive">Close session</button>
      <button class="btn btn--link">Link</button>
    </div>
    <p class="footnote" style="padding:0;margin-top:20px">
      Pill radius (48px), semibold 14px label, press = scale(0.97).
      One primary per surface; tint is the quiet icon-affordance chip.
    </p>
  </div>
</div>
</body>
</html>
