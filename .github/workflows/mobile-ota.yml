name: mobile-ota

# Publishes a JS-only update over the air (EAS Update), for changes that need
# no new binary. See mobile/docs/TESTFLIGHT.md for which pipeline a change
# belongs in — anything touching native modules, app.json's native surface, or
# the Expo SDK must go through mobile-release.yml instead.
#
# WHY THIS EXISTS, and it is the same reason mobile-release.yml exists.
# `eas update` uploads its exported bundle to Google Cloud Storage, and GCS
# geo-blocks the devbox's network outright:
#
#     Failed to upload assetmap to EAS
#     Reason: Request failed: 403 (Forbidden)
#
# So an OTA publish can never succeed from the devbox no matter how healthy the
# Expo account or the lockfile is. A GitHub runner is not blocked.
#
# Manual dispatch ONLY. An OTA publish reaches every installed build on the
# channel within seconds and there is no review in front of it, so it must
# never fire on push.

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Update message shown in `eas update:list`"
        required: true
      channel:
        description: "EAS channel to publish to"
        default: production
        type: choice
        options:
          - production
          - preview

concurrency:
  group: mobile-ota
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Same guard as mobile-release.yml: a stray npm lockfile once made EAS
      # build from an older dependency set and ship a binary missing native
      # modules. bun.lock is the source of truth.
      - name: Reject a stray package-lock.json
        run: |
          if [ -f package-lock.json ] || [ -f ../package-lock.json ]; then
            echo "::error::package-lock.json present. bun.lock is the source of truth; delete it."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # SEVEN OF THE NATIVE CHECKS RENDER COMPONENTS, and they do it through
      # `web/src/test-support/render`, importing React from the WEB workspace's
      # node_modules. The step above installs `mobile/` only -- a separate npm
      # graph -- so on a runner those seven died at import with
      # "Cannot find module '../../web/node_modules/react/jsx-dev-runtime'".
      #
      # They passed locally the whole time, because a dev box has the root
      # workspace installed already. That is exactly the shape of gap that let
      # eight check files go unrun for months: green here, absent there.
      - name: Install the workspace deps the render harness needs
        working-directory: ${{ github.workspace }}
        run: |
          bun install --frozen-lockfile
          # Asserted, not assumed: the checks import React by PATH from the web
          # workspace, so a hoist that put it somewhere else would break them
          # again with the same unhelpful "module not found" at import.
          if [ ! -d web/node_modules/react ]; then
            echo "::error::web/node_modules/react is missing after a workspace install; the render-harness checks cannot run."
            exit 1
          fi

      - name: Type check
        run: bunx tsc --noEmit

      # The widget, Live Activity and deep-link checks. `bun test` does NOT
      # discover the `.native-check.ts` suffix, so for months these ran only
      # when somebody typed the path by hand — which meant a widget that
      # rendered a blank puck in tinted mode, and a notification tap that
      # stacked a second home screen, both reached a device with every
      # automated check green. A type check cannot see either one.
      #
      # The script globs rather than listing paths, so a new check is picked
      # up by existing. An unmatched glob exits 1, so it cannot pass silently.
      - name: Native behaviour checks
        run: bun run test:native

      # EXPO_PUBLIC_* IS INLINED AT BUNDLE TIME, AND eas.json CANNOT HELP HERE.
      #
      # The Google client id lives in eas.json under `build.<profile>.env`,
      # which `eas build` reads and `eas update` does not. So every OTA
      # published without it inlined `""`, `googleSignInConfigured` came out
      # false, and the Google button VANISHED from a binary that shipped with
      # it. Silently: no error, no crash, one fewer way to sign in.
      #
      # Read from eas.json rather than pasted here, so there is one source of
      # truth and the two cannot drift. The value is a public client
      # identifier, not a secret -- see the note beside it in eas.json.
      - name: Carry the public Google client id into the bundle
        run: |
          # eas.json carries comments, so it is JSONC and `require` chokes on
          # it. One well-known key, read with a regex, needs no parser.
          id=$(grep -m1 -o '"EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID"[[:space:]]*:[[:space:]]*"[^"]*"' eas.json | sed 's/.*: *"\(.*\)"$/\1/')
          if [ -z "$id" ]; then
            echo "::error::eas.json has no production EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID; an OTA would drop the Google button."
            exit 1
          fi
          echo "EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=$id" >> "$GITHUB_ENV"

      # An OTA publish has no review stage in front of it, so the export has to
      # pass here rather than break on someone's phone.
      - name: Metro export smoke test
        run: bunx expo export --platform ios

      # The export is the same bundle the publish will ship, so assert the id
      # actually reached it. The step above can be right and still produce a
      # bundle without it -- a renamed variable, a changed gate, a config
      # plugin -- and the failure mode is invisible on a device.
      - name: Check the exported bundle can offer Google sign-in
        run: |
          if ! grep -rqF "$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID" dist; then
            echo "::error::The exported bundle does not contain the Google client id. Publishing would remove the Google button."
            exit 1
          fi

      # OTA cannot carry native code. If the native surface moved since the last
      # build, publishing JS that expects it can crash on launch. Fail loudly and
      # make a human decide rather than discovering it on a device.
      - name: Refuse to publish when the native surface moved
        run: |
          if ! git diff --quiet origin/main -- app.json package.json 2>/dev/null; then
            echo "::warning::app.json or package.json differs from main — confirm no native module changed since the installed build."
          fi

      - name: Publish update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          bunx eas-cli@22.0.0 update \
            --channel "${{ inputs.channel }}" \
            --environment production \
            --non-interactive \
            --message "${{ inputs.message }}"
