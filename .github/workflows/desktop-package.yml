name: desktop-package

# Electrobun builds the current host OS and architecture. Use native runners
# for every supported desktop target. The final job updates a rolling preview
# release so the README can use a stable, public download URL. Installed apps
# poll the update.json files on that release to auto-update, so every version
# tag republishes it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the desktop-preview release that installed apps update from"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # One rolling release: never publish two builds at once.
  group: desktop-package
  cancel-in-progress: false

jobs:
  verify:
    name: Verify desktop package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Electrobun types
        run: bun run --cwd desktop desktop:prepare

      - name: Test desktop runtime
        run: bun run desktop:test

      - name: Type check desktop package
        run: bun run --cwd desktop typecheck

  package:
    name: Package ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare macOS icon
        if: matrix.target == 'macos-arm64'
        run: bun run --cwd desktop desktop:icon

      - name: Import macOS signing certificate
        if: matrix.target == 'macos-arm64'
        shell: bash
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          ELECTROBUN_APPLEAPIKEY: ${{ secrets.ELECTROBUN_APPLEAPIKEY }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CERT_P12_BASE64" ]; then
            echo '::warning::No signing certificate secret. The macOS app stays unsigned.'
            exit 0
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/devid.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/devid.p12"
          security find-identity -v -p codesigning "$keychain"

          key_path="$RUNNER_TEMP/AuthKey_${ELECTROBUN_APPLEAPIKEY}.p8"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key_path"
          echo "ELECTROBUN_APPLEAPIKEYPATH=$key_path" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build self-contained native package
        shell: bash
        env:
          ELECTROBUN_DEVELOPER_ID: ${{ matrix.target == 'macos-arm64' && secrets.ELECTROBUN_DEVELOPER_ID || '' }}
          ELECTROBUN_TEAMID: ${{ secrets.ELECTROBUN_TEAMID }}
          ELECTROBUN_APPLEAPIKEY: ${{ secrets.ELECTROBUN_APPLEAPIKEY }}
          ELECTROBUN_APPLEAPIISSUER: ${{ secrets.ELECTROBUN_APPLEAPIISSUER }}
        run: |
          set -euo pipefail

          if bun run desktop:build; then
            exit 0
          fi

          if [ "${{ matrix.target }}" != 'macos-arm64' ]; then
            exit 1
          fi

          echo '::warning::The macOS disk image build failed once. Retrying a known transient hdiutil failure.'
          bun run desktop:build

      - name: Verify macOS signature and notarization
        if: matrix.target == 'macos-arm64' && env.SIGNING_KEYCHAIN != ''
        shell: bash
        run: |
          set -euo pipefail
          app="$(find desktop/build -maxdepth 5 -name '*.app' -type d | head -1)"
          echo "Checking $app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          dmg="$(ls desktop/artifacts/*.dmg | head -1)"
          xcrun stapler validate "$dmg" || echo '::warning::The DMG has no stapled ticket.'

      - name: Remove signing keychain
        if: always() && matrix.target == 'macos-arm64' && env.SIGNING_KEYCHAIN != ''
        run: |
          security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -f "$ELECTROBUN_APPLEAPIKEYPATH"

      - name: Verify package artifacts
        shell: bash
        run: |
          set -euo pipefail

          found=0
          for file in desktop/artifacts/*; do
            [ -f "$file" ] || continue
            if [ ! -s "$file" ]; then
              echo "::error file=$file::Package artifact is empty."
              exit 1
            fi
            found=1
          done

          if [ "$found" -ne 1 ]; then
            echo "::error::Electrobun did not create package artifacts."
            exit 1
          fi

          case "${{ matrix.target }}" in
            macos-arm64)
              ls desktop/artifacts/*.dmg >/dev/null
              ls desktop/artifacts/*.app.tar.zst >/dev/null
              ;;
            linux-*)
              ls desktop/artifacts/*-Setup.tar.gz >/dev/null
              ls desktop/artifacts/*.tar.zst >/dev/null
              ;;
          esac

          (
            cd desktop/artifacts
            shasum -a 256 * | tee "${{ matrix.target }}-SHA256SUMS.txt"
          )

          {
            echo "### ${{ matrix.target }} packages"
            echo '```text'
            while IFS= read -r file; do
              bytes="$(wc -c < "$file" | tr -d ' ')"
              echo "$(basename "$file") ($bytes bytes)"
            done < <(find desktop/artifacts -maxdepth 1 -type f | sort)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omg.dev-${{ matrix.target }}
          path: desktop/artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-preview:
    name: Publish desktop preview
    needs: package
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download native packages
        uses: actions/download-artifact@v4
        with:
          pattern: omg.dev-*
          path: desktop-dist
          merge-multiple: true

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          test -s desktop-dist/macos-arm64-omg.dev.dmg
          test -s desktop-dist/linux-x64-omg.dev-Setup.tar.gz
          test -s desktop-dist/linux-arm64-omg.dev-Setup.tar.gz
          test -s desktop-dist/macos-arm64-SHA256SUMS.txt
          test -s desktop-dist/linux-x64-SHA256SUMS.txt
          test -s desktop-dist/linux-arm64-SHA256SUMS.txt
          # Auto-update manifests and archives read by installed apps.
          for target in macos-arm64 linux-x64 linux-arm64; do
            test -s "desktop-dist/stable-$target-update.json"
          done
          test -s desktop-dist/stable-macos-arm64-omg.dev.app.tar.zst

      - name: Publish rolling preview release
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: desktop-preview
        shell: bash
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/desktop-preview-notes.md"
          {
            echo 'Native omg.dev desktop preview packages.'
            echo
            echo '- macOS supports Apple Silicon.'
            echo '- The macOS app is signed with Developer ID and notarized by Apple.'
            echo '- Linux packages are available for x64 and ARM64.'
            echo '- Every package includes the omg.dev UI and local runtime.'
            echo
            echo "Built from \`$GITHUB_REF_NAME\`, commit \`$GITHUB_SHA\`, by [GitHub Actions]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          } > "$notes_file"

          if gh release view "$PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$PREVIEW_TAG" desktop-dist/* \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$PREVIEW_TAG" \
              --title 'omg.dev desktop preview' \
              --notes-file "$notes_file" \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$PREVIEW_TAG" desktop-dist/* \
              --target "$GITHUB_SHA" \
              --title 'omg.dev desktop preview' \
              --notes-file "$notes_file" \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          fi
