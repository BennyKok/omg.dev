name: mobile-release

# Builds the iOS app on EAS and (optionally) submits it to App Store Connect.
#
# WHY THIS EXISTS AT ALL. Every EAS build uploads its project tarball to Google
# Cloud Storage. GCS geo-blocks some networks outright, answering the signed
# upload URL with:
#
#     <Code>AccessDenied</Code>
#     <Details>We're sorry, but this service is not available in your location</Details>
#
# The devbox is one of those networks, so `eas build` can never succeed from it
# no matter how healthy the account, credentials or lockfile are. A GitHub
# runner is not blocked. Running the build here removes the dependency on
# whichever laptop happened to be awake, which is how builds 27-29 got made.
#
# Manual dispatch ONLY. Builds cost real money (iOS medium is $2 each against
# the plan's $45/period credit), so this must never fire on push.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        default: production
        type: choice
        options:
          - production
          - preview
          # Unsigned dev client for the iOS Simulator. Native modules cannot
          # ship over the air, so every native dependency change needs one of
          # these before the change can be looked at. Never submit this.
          - simulator
      submit:
        description: "Submit to App Store Connect after a successful build"
        default: false
        type: boolean
      runner:
        description: "Where to build"
        default: mac
        type: choice
        options:
          # bennys-macbook-pro-2, registered as a self-hosted runner. Free:
          # `eas build --local` produces the same signed IPA without spending
          # an EAS build. Needs the Mac awake and on the tailnet.
          - mac
          # Expo's macOS cloud. About $2 per iOS build, but always available.
          # Keep this for when the Mac is asleep, or busy with the e2e suite.
          - cloud

# EAS Starter includes ONE build concurrency. A second in-flight build would
# queue behind this one and hold a runner open for no reason, so serialise.
concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.runner == 'cloud' }}
    runs-on: ubuntu-latest
    # A cloud build regularly runs 20-40 minutes and `--wait` blocks on it.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `bun.lock` is the single source of truth. A `package-lock.json` once
      # coexisted with it and EAS built from the npm lockfile, which described
      # an older dependency set: the build SUCCEEDED, shipped a binary without
      # expo-image-picker/expo-audio, and the app died at import with
      # "Cannot find native module 'ExponentImagePicker'". Nothing before
      # runtime said a word. Fail loudly here instead.
      - name: Reject a stray package-lock.json
        run: |
          if [ -f package-lock.json ] || [ -f ../package-lock.json ]; then
            echo "::error::package-lock.json present. bun.lock is the source of truth; delete it."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # SEVEN OF THE NATIVE CHECKS RENDER COMPONENTS, and they do it through
      # `web/src/test-support/render`, importing React from the WEB workspace's
      # node_modules. The step above installs `mobile/` only -- a separate npm
      # graph -- so on a runner those seven died at import with
      # "Cannot find module '../../web/node_modules/react/jsx-dev-runtime'".
      #
      # They passed locally the whole time, because a dev box has the root
      # workspace installed already. That is exactly the shape of gap that let
      # eight check files go unrun for months: green here, absent there.
      - name: Install the workspace deps the render harness needs
        working-directory: ${{ github.workspace }}
        run: |
          bun install --frozen-lockfile
          # Asserted, not assumed: the checks import React by PATH from the web
          # workspace, so a hoist that put it somewhere else would break them
          # again with the same unhelpful "module not found" at import.
          if [ ! -d web/node_modules/react ]; then
            echo "::error::web/node_modules/react is missing after a workspace install; the render-harness checks cannot run."
            exit 1
          fi

      # Both checks below are cheap and run BEFORE anything bills. `expo export`
      # pushes the whole app through Metro and fails on breakage that tsc alone
      # misses, which has caught real problems in this project.
      - name: Type check
        run: bunx tsc --noEmit

      # See the same step in mobile-ota.yml. `bun test` does not discover the
      # `.native-check.ts` suffix, so these ran nowhere until this was added.
      - name: Native behaviour checks
        run: bun run test:native

      - name: Metro export smoke test
        run: bunx expo export --platform ios

      # Build 34 shipped "Allow $(PRODUCT_NAME) to access your microphone" and
      # was rejected under guideline 5.1.1(ii) TWICE, while app.json held the
      # correct long string the whole time. A config plugin overwrote it. Only
      # the prebuild output can tell you what Apple will actually see, so
      # assert on that -- before anything bills.
      - name: Check iOS purpose strings in the generated Info.plist
        run: ./scripts/check-ios-purpose-strings.sh

      - name: Build on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: |
          bunx eas-cli@22.0.0 build \
            --platform ios \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --wait

      # Separate step, not `--auto-submit`. Building is not shipping: `eas build`
      # stops at an IPA on EAS servers and only `eas submit` reaches App Store
      # Connect. Keeping them apart means a submit failure does not read as a
      # build failure, and a build can be produced without being submitted.
      - name: Submit to App Store Connect
        if: ${{ inputs.submit && inputs.profile != 'simulator' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          bunx eas-cli@22.0.0 submit \
            --platform ios \
            --profile "${{ inputs.profile }}" \
            --latest \
            --non-interactive

  # ── The Mac ───────────────────────────────────────────────────────────────
  #
  # Same product as the cloud job, built with `eas build --local` on
  # bennys-macbook-pro-2. It costs no EAS build credit, which is the point:
  # four cloud builds on 2026-09-23 spent about $8 and two of them failed for
  # toolchain reasons rather than anything in the app.
  #
  # The step is deliberately THIN. Everything that makes a local build work
  # lives in mobile/scripts/mac-build.ts, next to the comments explaining why,
  # so a person debugging this can run the identical thing by hand:
  #
  #   bun run build:mac --ref main --xcode 27
  #
  # This job does NOT check out the repo onto the runner. The script drives a
  # clone the Mac owns, because `eas build --local` archives from the git root
  # and metro.config.js watches ../packages/protocol/src, outside mobile/.
  # A checkout of this workflow's own workspace would not have that sibling.
  build-mac:
    if: ${{ inputs.runner == 'mac' }}
    runs-on: [self-hosted, macOS, ARM64, omg-mac]
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # The runner starts from launchd, so it inherits a minimal PATH with no
      # bun, no nvm node and no Homebrew. The first CI run died on
      # "bun: command not found". mac-build.ts sets up its own PATH for the
      # build itself; this is only what is needed to START it.
      - name: Build on the Mac
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          export PATH="$HOME/.bun/bin:/opt/homebrew/bin:$PATH"
          cd mobile
          bun run scripts/mac-build.ts \
            --ref "${{ github.sha }}" \
            --xcode 27 \
            --profile "${{ inputs.profile }}" \
            ${{ (inputs.submit && inputs.profile != 'simulator') && '--submit' || '' }}
